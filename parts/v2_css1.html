<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>千葉ロッテマリーンズ｜ファンハブ（選手名鑑・スタメン・観戦記録・フォトギャラリー）</title>
  <meta name="description" content="千葉ロッテマリーンズファン向け総合Webアプリ。選手名鑑・グラウンド型スタメン作成・観戦記録＆勝率自動計算・現地フォトギャラリー。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark: #0a0a0f; --surface: #111118; --surface2: #1a1a26;
      --card-bg: #13131e; --card-hover: #1c1c2e;
      --marines-blue: #0050a0; --marines-red: #c8102e;
      --accent: #00aaff; --accent2: #7b61ff; --gold: #f5a623; --green: #10b981;
      --white: #ffffff; --muted: #8888aa;
      --border: rgba(255,255,255,0.08); --border-accent: rgba(0,170,255,0.3);
      --glow: 0 0 20px rgba(0,170,255,0.35); --glow-red: 0 0 20px rgba(200,16,46,0.5);
      --glow-gold: 0 0 20px rgba(245,166,35,0.4);
      --radius: 14px; --radius-sm: 8px; --t: 0.22s cubic-bezier(0.4,0,0.2,1);
    }

    html { scroll-behavior: smooth; }
    body { background: var(--dark); color: var(--white); font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; overflow-x: hidden; }

    header {
      position: relative;
      background: linear-gradient(160deg, #0a0010 0%, #000000 45%, #00001a 100%);
      border-bottom: 1px solid var(--border); padding: 0 16px; overflow: hidden;
    }
    header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 120% at 50% -20%, rgba(0,100,200,0.25) 0%, transparent 70%); pointer-events: none; }
    header::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--marines-red), var(--accent), var(--marines-red), transparent); animation: scanline 4s ease-in-out infinite; }
    @keyframes scanline { 0%,100% { opacity:.4; } 50% { opacity:1; } }

    .header-inner { max-width: 1200px; margin: 0 auto; padding: 18px 0 0; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .header-logo { width: 50px; height: 50px; background: linear-gradient(135deg, var(--marines-red), #8b0000); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; box-shadow: 0 0 0 3px rgba(200,16,46,0.3), var(--glow-red); flex-shrink: 0; user-select: none; }
    .header-text { flex: 1; min-width: 180px; }
    .header-text h1 { font-family: 'Oswald', sans-serif; font-size: clamp(18px,4vw,26px); font-weight: 700; letter-spacing: 2px; line-height: 1.1; background: linear-gradient(135deg, #fff 0%, var(--accent) 60%, #fff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .header-text p { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
    .header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
    .header-btn { padding: 6px 12px; border-radius: 50px; border: 1px solid var(--border-accent); background: rgba(0, 170, 255, 0.08); color: var(--white); font-family: 'Noto Sans JP', sans-serif; font-size: 11px; font-weight: 700; cursor: pointer; transition: all var(--t); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .header-btn:hover { background: rgba(0, 170, 255, 0.25); border-color: var(--accent); transform: translateY(-1px); }

    /* Google Sync UI */
    .google-btn { padding: 6px 14px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: var(--white); font-family: 'Noto Sans JP', sans-serif; font-size: 11px; font-weight: 700; cursor: pointer; transition: all var(--t); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .google-btn:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.4); transform: translateY(-1px); }
    .google-btn.logged-in { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.4); color: #34d399; }
    .user-profile { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 50px; padding: 3px 10px 3px 4px; font-size: 11px; }
    .user-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-accent); }
    .user-name { font-weight: 700; color: var(--white); max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gdrive-actions { display: flex; align-items: center; gap: 6px; }

    .nav-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .tab-btn { padding: 10px 18px; border-radius: 10px 10px 0 0; border: 1px solid var(--border); border-bottom: none; background: rgba(255,255,255,0.04); color: var(--muted); font-family: 'Noto Sans JP', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; transition: all var(--t); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    .tab-btn:hover { color: var(--white); background: rgba(255,255,255,0.08); }
    .tab-btn.active { background: var(--dark); color: var(--white); border-color: var(--border-accent); box-shadow: 0 -2px 12px rgba(0,170,255,0.2); }

    main { max-width: 1200px; margin: 0 auto; padding: 28px 16px 80px; }
    .tab-content { display: none; animation: fadeIn 0.28s ease both; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    .search-section { margin-bottom: 28px; }
    .search-wrap { position: relative; margin-bottom: 16px; }
    #searchInput { width: 100%; padding: 14px 16px 14px 48px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 50px; color: var(--white); font-family: 'Noto Sans JP', sans-serif; font-size: 15px; outline: none; transition: border-color var(--t), box-shadow var(--t); }
    #searchInput::placeholder { color: var(--muted); }
    #searchInput:focus { border-color: var(--accent); box-shadow: var(--glow); }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .clear-btn { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: none; border-radius: 50%; width: 26px; height: 26px; color: var(--muted); cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 13px; }
    .clear-btn.visible { display: flex; }
    .clear-btn:hover { background: rgba(255,255,255,0.2); color: var(--white); }

    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { padding: 7px 16px; border-radius: 50px; border: 1.5px solid var(--border); background: transparent; color: var(--muted); font-family: 'Noto Sans JP', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: all var(--t); }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: linear-gradient(135deg, var(--marines-blue), var(--accent2)); border-color: transparent; color: var(--white); box-shadow: 0 4px 15px rgba(0,80,160,0.4); }

    .result-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .result-count { font-size: 12px; color: var(--muted); }
    .result-count span { color: var(--accent); font-weight: 700; }

    #playerGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .player-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 16px 18px; cursor: pointer; position: relative; overflow: hidden; transition: transform var(--t), border-color var(--t), box-shadow var(--t); animation: fadeInUp 0.32s ease both; display: flex; flex-direction: column; }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    .player-card::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(0,80,160,0.08) 0%,transparent 60%); pointer-events:none; }
    .player-card::after { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--marines-red),var(--accent)); transform:scaleX(0); transform-origin:left; transition:transform var(--t); }
    .player-card:hover { transform:translateY(-4px); border-color:var(--border-accent); box-shadow:0 12px 40px rgba(0,0,0,0.5),var(--glow); background:var(--card-hover); }
    .player-card:hover::after { transform:scaleX(1); }
    .card-number { font-family:'Oswald',sans-serif; font-size:38px; font-weight:700; color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,0.1); position:absolute; top:10px; right:12px; user-select:none; transition:-webkit-text-stroke-color var(--t); }
    .player-card:hover .card-number { -webkit-text-stroke-color:rgba(0,170,255,0.3); }
    .card-badge { display:inline-block; padding:3px 8px; border-radius:50px; font-size:10px; font-weight:700; letter-spacing:1px; margin-bottom:10px; }
    .badge-pitcher  { background:rgba(200,16,46,0.2);  color:#ff6b7a; border:1px solid rgba(200,16,46,0.3); }
    .badge-catcher  { background:rgba(245,166,35,0.15); color:#f5c842; border:1px solid rgba(245,166,35,0.3); }
    .badge-infield  { background:rgba(0,170,255,0.12); color:#5dd4ff; border:1px solid rgba(0,170,255,0.25); }
    .badge-outfield { background:rgba(123,97,255,0.15); color:#b8a8ff; border:1px solid rgba(123,97,255,0.3); }
    .card-name { font-size:17px; font-weight:700; color:var(--white); line-height:1.3; margin-bottom:3px; }
    .card-kana { font-size:10px; color:var(--muted); margin-bottom:8px; }
    .card-comment-snippet { font-size:11px; color:rgba(255,255,255,0.7); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:12px; }
    .card-footer { display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:10px; border-top:1px solid var(--border); }
    .card-num-label { font-family:'Oswald',sans-serif; font-size:13px; color:var(--muted); }
    .card-num-label span { font-size:18px; font-weight:700; color:var(--white); }
    .card-arrow { width:28px; height:28px; border-radius:50%; background:rgba(0,170,255,0.1); border:1px solid rgba(0,170,255,0.2); display:flex; align-items:center; justify-content:center; color:var(--accent); transition:background var(--t),transform var(--t); }
    .player-card:hover .card-arrow { background:rgba(0,170,255,0.25); transform:translateX(2px); }
    #emptyState { display:none; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; text-align:center; grid-column:1/-1; }
    #emptyState.visible { display:flex; }
    .empty-icon { font-size:48px; margin-bottom:14px; }
    .empty-title { font-size:17px; font-weight:700; margin-bottom:6px; }
    .empty-sub { font-size:12px; color:var(--muted); }

    /* Player Card Stats Button */
    .card-stats-btn { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 4px; background: rgba(0, 170, 255, 0.12); border: 1px solid rgba(0, 170, 255, 0.3); color: var(--accent); font-size: 11px; font-weight: 700; text-decoration: none; transition: all var(--t); margin-top: 6px; width: fit-content; }
    .card-stats-btn:hover { background: rgba(0, 170, 255, 0.28); color: var(--white); transform: translateY(-1px); }

    /* AI Chat Floating Widget */
    #aiChatToggleBtn { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--marines-red), #8b0000); border: 2px solid rgba(255,255,255,0.3); color: white; font-size: 24px; cursor: pointer; box-shadow: 0 8px 25px rgba(200,16,46,0.6), var(--glow-red); display: flex; align-items: center; justify-content: center; z-index: 1200; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1); }
    #aiChatToggleBtn:hover { transform: scale(1.1); }
    #aiChatToggleBtn .chat-badge { position: absolute; top: -2px; right: -2px; width: 14px; height: 14px; background: var(--green); border: 2px solid var(--dark); border-radius: 50%; }

    #aiChatWindow { position: fixed; bottom: 90px; right: 24px; width: 340px; height: 460px; max-width: calc(100vw - 32px); max-height: calc(100vh - 120px); background: linear-gradient(160deg, #12121f 0%, #0a0a18 100%); border: 1px solid rgba(0,170,255,0.3); border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.8), var(--glow); display: flex; flex-direction: column; z-index: 1200; transform: translateY(20px) scale(0.95); opacity: 0; pointer-events: none; transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1); overflow: hidden; }
    #aiChatWindow.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: all; }
    .chat-header { background: linear-gradient(135deg, #0d0d24, #1a1a36); padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .chat-title { display: flex; align-items: center; gap: 10px; }
    .chat-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--marines-blue), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: white; border: 1px solid var(--border-accent); }
    .chat-name { font-size: 14px; font-weight: 700; color: var(--white); }
    .chat-status { font-size: 10px; color: var(--green); }
    .chat-close { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 2px 6px; }
    .chat-close:hover { color: var(--white); }
    .chat-body { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; scrollbar-width: thin; }
    .chat-msg { display: flex; flex-direction: column; max-width: 82%; }
    .chat-msg.bot { align-self: flex-start; }
    .chat-msg.user { align-self: flex-end; }
    .msg-bubble { padding: 9px 13px; border-radius: 14px; line-height: 1.5; word-break: break-word; }
    .chat-msg.bot .msg-bubble { background: var(--surface2); border: 1px solid var(--border); color: var(--white); border-bottom-left-radius: 3px; }
    .chat-msg.user .msg-bubble { background: linear-gradient(135deg, var(--marines-blue), var(--accent2)); color: var(--white); border-bottom-right-radius: 3px; }
    .chat-footer { padding: 10px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.3); display: flex; gap: 8px; }
    .chat-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 8px 14px; color: var(--white); font-family: 'Noto Sans JP', sans-serif; font-size: 12px; outline: none; }
    .chat-input:focus { border-color: var(--accent); }
    .chat-send-btn { background: var(--accent); border: none; border-radius: 50%; width: 34px; height: 34px; color: var(--dark); font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform var(--t); }
    .chat-send-btn:hover { transform: scale(1.05); }

    /* Schedule / Stats Links Card Modal */
    .link-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: var(--white); transition: all var(--t); }
    .link-card:hover { border-color: var(--border-accent); background: var(--card-hover); transform: translateX(3px); box-shadow: var(--glow); }
    .link-card-title { font-size: 14px; font-weight: 700; color: var(--white); display: flex; align-items: center; gap: 8px; }
    .link-card-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
