<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>千葉ロッテマリーンズ｜ファンハブ（選手名鑑・オーダー作成・観戦記録）</title>
  <meta name="description" content="千葉ロッテマリーンズの選手検索＆名鑑、理想のベストスタメン作成、今シーズンの観戦成績＆勝率自動計算ログをひとまとめにしたファン向けWebアプリです。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:        #000000;
      --dark:         #0a0a0f;
      --surface:      #111118;
      --surface2:     #1a1a26;
      --card-bg:      #13131e;
      --card-hover:   #1c1c2e;
      --marines-blue: #0050a0;
      --marines-red:  #c8102e;
      --accent:       #00aaff;
      --accent2:      #7b61ff;
      --gold:         #f5a623;
      --green:        #10b981;
      --white:        #ffffff;
      --muted:        #8888aa;
      --border:       rgba(255,255,255,0.08);
      --border-accent: rgba(0,170,255,0.3);
      --glow:         0 0 20px rgba(0,170,255,0.35);
      --glow-red:     0 0 20px rgba(200,16,46,0.5);
      --glow-gold:    0 0 20px rgba(245,166,35,0.4);
      --radius:       14px;
      --radius-sm:    8px;
      --transition:   0.22s cubic-bezier(0.4,0,0.2,1);
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--dark);
      color: var(--white);
      font-family: 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      position: relative;
      background: linear-gradient(160deg, #0a0010 0%, #000000 45%, #00001a 100%);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      overflow: hidden;
    }
    header::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 120% at 50% -20%, rgba(0,100,200,0.25) 0%, transparent 70%);
      pointer-events: none;
    }
    header::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--marines-red), var(--accent), var(--marines-red), transparent);
      animation: scanline 4s ease-in-out infinite;
    }
    @keyframes scanline { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

    .header-inner {
      max-width: 1200px; margin: 0 auto; padding: 24px 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px; position: relative; z-index: 1;
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .header-logo {
      width: 56px; height: 56px; background: linear-gradient(135deg, var(--marines-red), #8b0000);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: var(--white);
      letter-spacing: 1px; box-shadow: 0 0 0 3px rgba(200,16,46,0.3), var(--glow-red);
      flex-shrink: 0; user-select: none;
    }
    .header-text h1 {
      font-family: 'Oswald', sans-serif; font-size: clamp(20px, 4vw, 28px);
      font-weight: 700; letter-spacing: 2px; line-height: 1.1;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent) 60%, #ffffff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header-text p { font-size: 12px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 3px; }

    .nav-tabs {
      display: flex; gap: 8px; background: rgba(255,255,255,0.03);
      padding: 5px; border-radius: 50px; border: 1px solid var(--border);
    }
    .tab-btn {
      padding: 10px 22px; border-radius: 50px; border: none; background: transparent;
      color: var(--muted); font-family: 'Noto Sans JP', sans-serif; font-size: 14px;
      font-weight: 700; cursor: pointer; transition: all var(--transition);
      display: flex; align-items: center; gap: 8px; letter-spacing: 0.5px;
    }
    .tab-btn:hover { color: var(--white); background: rgba(255,255,255,0.06); }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--marines-blue), var(--accent2));
      color: var(--white); box-shadow: 0 4px 18px rgba(0,80,160,0.45);
    }

    main { max-width: 1200px; margin: 0 auto; padding: 36px 20px 80px; }
    .tab-content { display: none; animation: fadeIn 0.3s ease both; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .search-section { margin-bottom: 32px; }
    .search-wrap { position: relative; margin-bottom: 20px; }
    .search-icon {
      position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 18px; pointer-events: none; transition: color var(--transition);
    }
    #searchInput {
      width: 100%; padding: 16px 20px 16px 52px; background: var(--surface);
      border: 1.5px solid var(--border); border-radius: 50px; color: var(--white);
      font-family: 'Noto Sans JP', sans-serif; font-size: 16px; outline: none; transition: border-color var(--transition), box-shadow var(--transition);
    }
    #searchInput::placeholder { color: var(--muted); }
    #searchInput:focus { border-color: var(--accent); box-shadow: var(--glow); }
    .clear-btn {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.1); border: none; border-radius: 50%;
      width: 28px; height: 28px; color: var(--muted); cursor: pointer; display: none;
      align-items: center; justify-content: center; font-size: 14px; transition: background var(--transition), color var(--transition);
    }
    .clear-btn:hover { background: rgba(255,255,255,0.2); color: var(--white); }
    .clear-btn.visible { display: flex; }

    .filters { display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-btn {
      padding: 8px 20px; border-radius: 50px; border: 1.5px solid var(--border);
      background: transparent; color: var(--muted); font-family: 'Noto Sans JP', sans-serif;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all var(--transition); letter-spacing: 0.5px;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active {
      background: linear-gradient(135deg, var(--marines-blue), var(--accent2));
      border-color: transparent; color: var(--white); box-shadow: 0 4px 15px rgba(0,80,160,0.4);
    }

    .result-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .result-count { font-size: 13px; color: var(--muted); }
    .result-count span { color: var(--accent); font-weight: 700; }

    #playerGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
    .player-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px 18px 20px; cursor: pointer; position: relative; overflow: hidden;
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
      animation: fadeInUp 0.35s ease both; display: flex; flex-direction: column; justify-content: space-between;
    }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .player-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(0,80,160,0.08) 0%, transparent 60%); pointer-events: none; }
    .player-card::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--marines-red), var(--accent));
      transform: scaleX(0); transform-origin: left; transition: transform var(--transition);
    }
    .player-card:hover { transform: translateY(-5px); border-color: var(--border-accent); box-shadow: 0 12px 40px rgba(0,0,0,0.5), var(--glow); background: var(--card-hover); }
    .player-card:hover::after { transform: scaleX(1); }

    .card-number {
      font-family: 'Oswald', sans-serif; font-size: 42px; font-weight: 700; line-height: 1;
      color: transparent; -webkit-text-stroke: 1.5px rgba(255,255,255,0.12);
      position: absolute; top: 12px; right: 14px; letter-spacing: -1px;
      transition: -webkit-text-stroke-color var(--transition); user-select: none;
    }
    .player-card:hover .card-number { -webkit-text-stroke-color: rgba(0,170,255,0.3); }

    .card-badge { display: inline-block; padding: 3px 10px; border-radius: 50px; font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; align-self: flex-start; }
    .badge-pitcher  { background: rgba(200,16,46,0.2);  color: #ff6b7a; border: 1px solid rgba(200,16,46,0.3); }
    .badge-catcher  { background: rgba(245,166,35,0.15); color: #f5c842; border: 1px solid rgba(245,166,35,0.3); }
    .badge-infield  { background: rgba(0,170,255,0.12); color: #5dd4ff; border: 1px solid rgba(0,170,255,0.25); }
    .badge-outfield { background: rgba(123,97,255,0.15); color: #b8a8ff; border: 1px solid rgba(123,97,255,0.3); }

    .card-name { font-size: 18px; font-weight: 700; color: var(--white); line-height: 1.3; margin-bottom: 4px; }
    .card-kana { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
    .card-comment-snippet { font-size: 12px; color: rgba(255,255,255,0.7); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 14px; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }
    .card-num-label { font-family: 'Oswald', sans-serif; font-size: 14px; color: var(--muted); }
    .card-num-label span { font-size: 20px; font-weight: 700; color: var(--white); }
    .card-arrow { width: 30px; height: 30px; border-radius: 50%; background: rgba(0,170,255,0.1); border: 1px solid rgba(0,170,255,0.2); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 13px; transition: background var(--transition), transform var(--transition); }
    .player-card:hover .card-arrow { background: rgba(0,170,255,0.25); transform: translateX(2px); }

    #emptyState { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; text-align: center; grid-column: 1 / -1; }
    #emptyState.visible { display: flex; }
    .empty-icon { font-size: 56px; margin-bottom: 16px; filter: grayscale(0.5); }
    .empty-title { font-size: 18px; font-weight: 700; color: var(--white); margin-bottom: 8px; }
    .empty-sub { font-size: 13px; color: var(--muted); }

    .section-header { margin-bottom: 28px; }
    .section-title { font-size: 24px; font-weight: 900; letter-spacing: 1px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
    .section-desc { font-size: 13px; color: var(--muted); }

    .order-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    .order-card-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .order-form-title { font-size: 16px; font-weight: 700; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid var(--border); color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
    .pitcher-slot { background: rgba(200,16,46,0.1); border: 1px solid rgba(200,16,46,0.3); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
    .slot-label-sp { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 14px; color: #ff6b7a; width: 80px; flex-shrink: 0; }
    .order-slot-list { display: flex; flex-direction: column; gap: 12px; }
    .order-slot-item { display: flex; align-items: center; gap: 10px; background: var(--card-bg); border: 1px solid var(--border); padding: 10px 14px; border-radius: var(--radius-sm); }
    .slot-num { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 18px; color: var(--accent); width: 28px; text-align: center; }
    .slot-pos-select { background: var(--surface2); border: 1px solid var(--border); color: var(--white); padding: 8px 10px; border-radius: 6px; font-size: 13px; font-weight: 700; outline: none; cursor: pointer; width: 70px; }
    .slot-player-select { flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--white); padding: 8px 12px; border-radius: 6px; font-size: 13.5px; outline: none; cursor: pointer; }
    .slot-player-select:focus { border-color: var(--accent); }

    .btn-group { display: flex; gap: 12px; margin-top: 24px; }
    .btn-primary {
      flex: 1; padding: 14px 20px; background: linear-gradient(135deg, var(--marines-blue), var(--accent2));
      border: none; border-radius: 50px; color: var(--white); font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,80,160,0.4); transition: transform var(--transition), box-shadow var(--transition);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,80,160,0.6); }
    .btn-secondary { padding: 14px 24px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 50px; color: var(--muted); font-size: 14px; font-weight: 500; cursor: pointer; transition: all var(--transition); }
    .btn-secondary:hover { background: rgba(255,255,255,0.12); color: var(--white); }

    .stamen-board { background: linear-gradient(160deg, #091c10 0%, #05100a 100%); border: 2px solid rgba(16,185,129,0.3); border-radius: var(--radius); padding: 24px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.6); overflow: hidden; }
    .stamen-board::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 90%, rgba(16,185,129,0.15) 0%, transparent 70%); pointer-events: none; }
    .board-header { text-align: center; margin-bottom: 20px; border-bottom: 1px dashed rgba(16,185,129,0.3); padding-bottom: 12px; }
    .board-header h3 { font-family: 'Oswald', sans-serif; font-size: 20px; letter-spacing: 2px; color: #34d399; }
    .sp-display-card { background: rgba(0,0,0,0.6); border: 1px solid rgba(200,16,46,0.5); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
    .sp-tag { background: var(--marines-red); color: var(--white); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
    .sp-name { font-weight: 700; font-size: 16px; }
    .board-order-grid { display: flex; flex-direction: column; gap: 8px; }
    .board-row { display: flex; align-items: center; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.06); border-radius: var(--radius-sm); padding: 10px 14px; transition: background var(--transition); }
    .board-row:hover { background: rgba(16,185,129,0.1); }
    .board-bat-num { font-family: 'Oswald', sans-serif; font-size: 18px; font-weight: 700; color: #34d399; width: 30px; }
    .board-pos-badge { width: 32px; height: 24px; background: rgba(255,255,255,0.1); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--white); margin-right: 12px; }
    .board-player-info { flex: 1; display: flex; align-items: center; justify-content: space-between; }
    .board-player-name { font-weight: 700; font-size: 15px; }
    .board-player-num { font-family: 'Oswald', sans-serif; font-size: 15px; color: var(--muted); }

    .gamelog-layout { display: grid; grid-template-columns: 360px 1fr; gap: 28px; }
    .stats-dashboard { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 12px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; position: relative; overflow: hidden; }
    .stat-card.highlight { background: linear-gradient(135deg, rgba(0,80,160,0.2) 0%, rgba(123,97,255,0.15) 100%); border-color: rgba(0,170,255,0.4); box-shadow: var(--glow); }
    .stat-label { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }
    .stat-value { font-family: 'Oswald', sans-serif; font-size: clamp(28px, 4vw, 40px); font-weight: 700; line-height: 1; }
    .stat-value.win-rate { color: var(--gold); text-shadow: var(--glow-gold); }
    .stat-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }

    .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; height: fit-content; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 13px; font-weight: 700; color: var(--white); margin-bottom: 6px; }
    .form-input, .form-select, .form-textarea {
      width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--white);
      padding: 11px 14px; border-radius: var(--radius-sm); font-family: 'Noto Sans JP', sans-serif; font-size: 14px; outline: none; transition: border-color var(--transition);
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
    .form-textarea { resize: vertical; min-height: 70px; }

    .result-radio-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .radio-option { position: relative; }
    .radio-option input { position: absolute; opacity: 0; pointer-events: none; }
    .radio-label {
      display: flex; align-items: center; justify-content: center; padding: 10px 8px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; cursor: pointer; transition: all var(--transition); color: var(--muted);
    }
    .radio-option input:checked + .radio-label.win { background: rgba(16,185,129,0.2); border-color: var(--green); color: #34d399; }
    .radio-option input:checked + .radio-label.lose { background: rgba(200,16,46,0.2); border-color: var(--marines-red); color: #ff6b7a; }
    .radio-option input:checked + .radio-label.draw { background: rgba(255,255,255,0.1); border-color: var(--muted); color: var(--white); }

    .logs-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
    .logs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .logs-header h3 { font-size: 16px; font-weight: 700; color: var(--white); }
    .log-list { display: flex; flex-direction: column; gap: 12px; }
    .log-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; transition: transform var(--transition); }
    .log-item:hover { transform: translateX(3px); }
    .log-main-info { display: flex; align-items: center; gap: 14px; flex: 1; }
    .result-pill { padding: 6px 12px; border-radius: 50px; font-size: 12px; font-weight: 900; letter-spacing: 1px; min-width: 60px; text-align: center; }
    .result-pill.win { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.4); }
    .result-pill.lose { background: rgba(200,16,46,0.2); color: #ff6b7a; border: 1px solid rgba(200,16,46,0.4); }
    .result-pill.draw { background: rgba(255,255,255,0.1); color: var(--muted); border: 1px solid var(--border); }

    .log-details { flex: 1; }
    .log-date-stadium { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
    .log-vs { font-size: 15px; font-weight: 700; color: var(--white); }
    .log-memo { font-size: 12.5px; color: rgba(255,255,255,0.7); margin-top: 4px; }
    .log-del-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 4px; transition: color var(--transition), background var(--transition); }
    .log-del-btn:hover { color: #ff6b7a; background: rgba(200,16,46,0.15); }

    #toast {
      position: fixed; bottom: 24px; right: 24px; background: linear-gradient(135deg, var(--marines-blue), var(--accent2));
      color: var(--white); padding: 12px 24px; border-radius: 50px; font-size: 14px; font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), var(--glow); z-index: 2000; opacity: 0; transform: translateY(20px); pointer-events: none; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    #modalOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.28s ease;
    }
    #modalOverlay.open { opacity: 1; pointer-events: all; }

    #modal {
      background: linear-gradient(160deg, #12121f 0%, #0a0a18 100%); border: 1px solid rgba(0,170,255,0.2); border-radius: 20px;
      width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 60px rgba(0,50,120,0.3);
      transform: translateY(30px) scale(0.96); transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1), opacity 0.28s ease; opacity: 0;
    }
    #modal::-webkit-scrollbar { width: 6px; }
    #modal::-webkit-scrollbar-track { background: transparent; }
    #modal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    #modalOverlay.open #modal { transform: translateY(0) scale(1); opacity: 1; }

    .modal-header { background: linear-gradient(135deg, #08082a 0%, #0d0d24 100%); padding: 32px 32px 24px; border-radius: 20px 20px 0 0; position: relative; overflow: hidden; }
